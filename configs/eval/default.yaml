name: default

# Per-facet metrics
metrics:
  kc:
    - auc
    - brier
    - kl_to_gold
  misconception:
    - f1_at_5
    - mrr_at_10
    - jaccard
  metacog:
    - pearson_r
    - mae
    - monotonic_agreement
  calibration:
    - ece
    - sharpness

# Identifiability sweep
identifiability:
  T_grid: [2, 4, 8, 16, 32]
  tutor_move_entropy_bins: [low, med, high]
  n_posterior_samples: 20
  temperature: 1.0

# Counterfactual replay
replay:
  k_grid: [1, 3, 5]
  metrics: [perplexity, bleu, bge_similarity]
  control: random_z

# Bootstrap CI
bootstrap:
  enabled: true
  n_resamples: 1000
  ci_level: 0.95

# Significance
significance:
  test: paired_wilcoxon
  multi_comparison_correction: benjamini_hochberg
  alpha: 0.05

# Seeds
seeds: [0, 1, 2]
